# The `cli` agent preset: the full coding agent behind one persistent shell.
#
# Every tool `ptc`/`standard` mounts is still mounted here, so the registry, the
# UI, subagents and every other consumer see the complete catalog. What this
# preset changes is the MODEL-FACING presentation: the `dsh-all-in-pwsh` row narrows
# the wire catalog to the persistent shell alone and exposes the rest as a
# `dsh-tool` command inside it, dispatching each call as a nested tool call so
# the Web conversation renders PTC-style sub-call rows.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone.

# ── identity ────────────────────────────────────────────────────────────────

# PTC mode's persona, deliberately NOT `complete`: the collapse rule and the
# generated command reference below are prompt sections this preset owns, and a
# complete persona would replace every one of them.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a coding agent powered by the {{model}} model.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── the one directly callable tool ──────────────────────────────────────────

# The persistent shell is the transport, so the one-shot `tool-pwsh` row is
# deliberately absent: it registers the same `pwsh` name and would collide.
# The PTY registry is agent-owned, so it lives in an entry-local realm.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    # The official PTY backend, configured for the PowerShell dialect. Only
    # PowerShell 7 is supported, so there is no second shell stack and no
    # platform branch here.
    #
    # Every other tool is reached through a native PowerShell object
    # interface, so the shell is started with an explicit startup script that
    # imports the module. `-NoExit` keeps it interactive: the profile is still
    # skipped, and the user's global profile is never touched.
    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 300000
        shellArgs:
          - '-NoLogo'
          - '-NoProfile'
          - '-NoExit'
          - '-File'
          # Replaced by install.ps1 with the absolute path of the installed bootstrap.
          - '__DSH_ALL_IN_PWSH_BOOTSTRAP__'

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * State is persistent across command calls and discussions with the user.
          * This shell is also how you reach every other tool: the system prompt names the PowerShell commands (Invoke-DshTool, Get-DshTool, Get-DshToolSchema) that list, describe and call them.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    # The whole mode. It sits INSIDE this group because it drives the same
    # isolated `terminals` instance the shell tool uses: before each command
    # it writes the execution identity into that shell's environment, which
    # is what makes a background process inherit the identity of the command
    # that started it and never upgrade to a later one.
    #
    # `transport` is the registered shell tool that stays directly callable;
    # everything else in this composition is reachable only through the
    # object interface the module presents.
    - id: dsh-all-in-pwsh
      name: './plugin/dsh-all-in-pwsh.mjs'
      config:
        transport: pwsh

# ── everything else stays mounted ───────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Only the model-facing controls; the task registry stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery. In this composition every read or search runs through the shell command bridge, which is read-only for the same reason.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # The engine the desktop runtime ships. This preset has no `run_code` beside
    # it, so unlike `ptc` this preset keeps both the engine and `workflow`
    # enabled: the workflow tool stays a normal mounted capability the model
    # reaches through the shell bridge.
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off by default with the base row it mirrors, matching `standard` and
    # `ptc`. Preset files take no patches, so a session that wants it
    # duplicates this preset under a new id and drops `disabled` here and on
    # the engine above.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true
